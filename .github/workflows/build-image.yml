name: Build image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Trigger the Dokploy deploy after the image is pushed so it pulls the
      # just-built :latest instead of racing the build. The webhook is a
      # GitHub-style receiver: it needs a push payload whose ref matches the
      # configured branch, or it responds "Branch Not Match". Dokploy Autodeploy
      # must stay ON — the webhook is gated by that toggle.
      - name: Trigger Dokploy deploy
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::DOKPLOY_DEPLOY_HOOK secret is not set." >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H 'Content-Type: application/json' \
            -H 'X-GitHub-Event: push' \
            -d "{\"ref\":\"${GITHUB_REF}\"}" \
            "$DEPLOY_HOOK"
          echo "Triggered Dokploy deploy."
