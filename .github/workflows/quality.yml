name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type-test:
    name: Lint, type, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.15'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Tests with coverage
        env:
          MYINSTANTS_BOT_TOKEN: test-token
          MYINSTANTS_ENV: dev
        run: uv run pytest --cov=bot --cov=crawler --cov-report=xml --cov-fail-under=55

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.15'
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: pip-audit
        run: uv run pip-audit --ignore-vuln PYSEC-2022-43012 || true

      - name: Ruff security rules
        run: uv run ruff check --select S .
