[project]
name = 'myinstants-bot'
version = '2.0.0'
description = 'A Discord bot that plays sounds from MyInstants in voice channels.'
readme = 'README.md'
license = { text = 'MIT' }
requires-python = '>=3.12,<3.14'
authors = [{ name = 'Giovani Moutinho', email = 'e@giovani.dev' }]
dependencies = [
    'discord-py[voice]>=2.7.1,<2.8',
    'yt-dlp>=2025.1.15',
    # myinstants.com sits behind a Cloudflare WAF that 403s any client
    # whose TLS/HTTP2 fingerprint isn't a real browser; headers alone
    # don't get through. curl-cffi impersonates one. yt-dlp also picks
    # it up automatically and retries its own 403s with impersonation.
    'curl-cffi~=0.16',
    'beautifulsoup4~=4.13',
    'aiohttp~=3.11',
    'loguru~=0.7.3',
    'pydantic~=2.10',
    'pydantic-settings~=2.7',
    'sqlalchemy[asyncio]~=2.0',
    'aiosqlite~=0.21',
    'alembic~=1.14',
    'aiocache~=0.12',
    'aiolimiter~=1.2',
    'sentry-sdk~=2.19',
]

[project.optional-dependencies]
dev = [
    'pytest~=9.0',
    'pytest-asyncio~=1.4',
    'pytest-cov~=6.0',
    'pytest-mock~=3.14',
    'ruff~=0.9',
    'pyright~=1.1.391',
    'pre-commit~=4.0',
    'pip-audit~=2.7',
]

[tool.uv]
# discord-py 2.7.1 pins PyNaCl<1.6, but 1.6.2 fixes CVE-2025-69277 and its
# only breaking change vs 1.5 is dropping Python 3.6/3.7 (irrelevant here).
# Capped at <2.0 so this override can't silently jump a future major
# release past what discord-py's voice code has been tested against.
override-dependencies = ['pynacl>=1.6.2,<2.0']

[project.urls]
Homepage = 'https://github.com/mgiovani/my-instants-discord-bot'
Issues = 'https://github.com/mgiovani/my-instants-discord-bot/issues'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['bot', 'crawler']

[tool.ruff]
line-length = 79
target-version = 'py312'

[tool.ruff.lint]
select = [
    'E',     # pycodestyle errors
    'F',     # pyflakes
    'W',     # pycodestyle warnings
    'I',     # isort
    'B',     # flake8-bugbear
    'UP',    # pyupgrade
    'SIM',   # flake8-simplify
    'ASYNC', # flake8-async
    'RUF',   # ruff-specific
    'ANN',   # flake8-annotations
    'PL',    # pylint subset
    'PTH',   # flake8-use-pathlib
    'TID',   # flake8-tidy-imports
    'C4',    # flake8-comprehensions
    'PIE',   # flake8-pie
    'RET',   # flake8-return
    'S',     # flake8-bandit
]
ignore = [
    'ANN401',  # allow Any in specific cases
    'PLR0913', # too many arguments
    'PLR2004', # magic value comparison (covered by config.py extraction)
    'S101',    # assert allowed in tests
    'S311',    # pseudo-random for shuffle is fine
    'B008',    # allow FastAPI/pydantic Field defaults in function calls
    'RET504',  # unnecessary assignment before return — prefer readability
]

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'ANN',
    'S101',
    'S105',
    'S106',
    'PLR0913',
    'PLC0415',  # local imports are fine for isolating test helpers
    'E501',
]
'bot/db/migrations/**/*.py' = ['ANN', 'I', 'E501', 'UP', 'F401', 'W291']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
known-first-party = ['bot', 'crawler']

[tool.pyright]
include = ['bot', 'crawler', 'tests']
exclude = ['**/__pycache__', '.venv', 'bot/db/migrations/versions']
pythonVersion = '3.12'
typeCheckingMode = 'standard'
# Strict only where we own the code. Tests stay at standard: full strict there
# is ~480 errors of untyped test functions, which ruff already exempts via
# per-file-ignores for ANN.
strict = ['bot', 'crawler']
reportMissingImports = 'error'
reportMissingTypeStubs = 'none'
reportImplicitOverride = 'warning'
reportUnnecessaryTypeIgnoreComment = 'warning'
reportAttributeAccessIssue = 'error'
reportArgumentType = 'error'

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
testpaths = ['tests']
addopts = [
    '-ra',
    '--strict-markers',
    '--strict-config',
]
filterwarnings = [
    'error',
    'ignore::DeprecationWarning:audioop',
    'ignore::DeprecationWarning:discord',
    'ignore::PendingDeprecationWarning',
]

[tool.coverage.run]
source = ['bot', 'crawler']
branch = true
omit = ['bot/db/migrations/*', 'bot/healthcheck.py']

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if __name__ == .__main__.:',
]
