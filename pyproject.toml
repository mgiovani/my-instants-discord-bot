[project]
name = 'myinstants-bot'
version = '2.0.0'
description = 'A Discord bot that plays sounds from MyInstants in voice channels.'
readme = 'README.md'
license = { text = 'MIT' }
requires-python = '>=3.12,<3.14'
authors = [{ name = 'Giovani Moutinho', email = 'e@giovani.dev' }]
dependencies = [
    'discord-py~=2.6',
    'PyNaCl~=1.5',
    'yt-dlp>=2025.1.15',
    'beautifulsoup4~=4.13',
    'aiohttp~=3.11',
    'loguru~=0.7.3',
    'pydantic~=2.10',
    'pydantic-settings~=2.7',
    'sqlalchemy[asyncio]~=2.0',
    'aiosqlite~=0.21',
    'alembic~=1.14',
    'aiocache~=0.12',
    'aiolimiter~=1.2',
    'sentry-sdk~=2.19',
]

[project.optional-dependencies]
dev = [
    'pytest~=8.3',
    'pytest-asyncio~=0.25',
    'pytest-cov~=6.0',
    'pytest-mock~=3.14',
    'aioresponses~=0.7',
    'ruff~=0.9',
    'pyright~=1.1.391',
    'pre-commit~=4.0',
    'pip-audit~=2.7',
]

[project.urls]
Homepage = 'https://github.com/mgiovani/my-instants-discord-bot'
Issues = 'https://github.com/mgiovani/my-instants-discord-bot/issues'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['bot', 'crawler']

[tool.ruff]
line-length = 79
target-version = 'py312'

[tool.ruff.lint]
select = [
    'E',     # pycodestyle errors
    'F',     # pyflakes
    'W',     # pycodestyle warnings
    'I',     # isort
    'B',     # flake8-bugbear
    'UP',    # pyupgrade
    'SIM',   # flake8-simplify
    'ASYNC', # flake8-async
    'RUF',   # ruff-specific
    'ANN',   # flake8-annotations
    'PL',    # pylint subset
    'PTH',   # flake8-use-pathlib
    'TID',   # flake8-tidy-imports
    'C4',    # flake8-comprehensions
    'PIE',   # flake8-pie
    'RET',   # flake8-return
    'S',     # flake8-bandit
]
ignore = [
    'ANN401',  # allow Any in specific cases
    'PLR0913', # too many arguments
    'PLR2004', # magic value comparison (covered by config.py extraction)
    'S101',    # assert allowed in tests
    'S311',    # pseudo-random for shuffle is fine
    'B008',    # allow FastAPI/pydantic Field defaults in function calls
    'RET504',  # unnecessary assignment before return — prefer readability
]

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = ['ANN', 'S101', 'S105', 'S106', 'PLR0913']
'bot/db/migrations/**/*.py' = ['ANN', 'I']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.isort]
known-first-party = ['bot', 'crawler']

[tool.pyright]
include = ['bot', 'crawler', 'tests']
exclude = ['**/__pycache__', '.venv', 'bot/db/migrations/versions']
pythonVersion = '3.12'
typeCheckingMode = 'basic'
reportMissingImports = 'error'
reportMissingTypeStubs = 'none'
reportImplicitOverride = 'warning'
reportUnnecessaryTypeIgnoreComment = 'warning'

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
addopts = [
    '-ra',
    '--strict-markers',
    '--strict-config',
]
filterwarnings = [
    'error',
    'ignore::DeprecationWarning:audioop',
    'ignore::DeprecationWarning:discord',
    'ignore::PendingDeprecationWarning',
]

[tool.coverage.run]
source = ['bot', 'crawler']
branch = true
omit = ['bot/db/migrations/*', 'bot/healthcheck.py']

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if __name__ == .__main__.:',
]
